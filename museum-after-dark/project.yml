name: MuseumAfterDark
options:
  bundleIdPrefix: ai.devin.museum
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
targets:
  MuseumAfterDark:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.museum.afterdark
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Museum After Dark
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MuseumAfterDarkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: MuseumAfterDark
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MuseumAfterDark:
    build:
      targets:
        MuseumAfterDark: all
        MuseumAfterDarkTests: [test]
    test:
      targets: [MuseumAfterDarkTests]
