name: NitroTots
options:
  bundleIdPrefix: dev.nitrotots
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    PRODUCT_NAME: NitroTots
targetTemplates:
  Native:
    type: application
    sources:
      - path: App
      - path: Core/Sources/NitroCore
        excludes: [Resources]
      - path: Resources
        buildPhase: resources
      - path: Core/Sources/NitroCore/Resources/catalog.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nitrotots.nitroTots
    info:
      properties:
        CFBundleDisplayName: Nitro Tots
        NSLocalNetworkUsageDescription: Nitro Tots connects to your chosen multiplayer server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
targets:
  NitroTots-iOS:
    templates: [Native]
    platform: iOS
    info:
      path: Config/iOS-Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  NitroTots-macOS:
    templates: [Native]
    platform: macOS
    info:
      path: Config/macOS-Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.racing-games
        NSHighResolutionCapable: true
    entitlements:
      path: Config/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  NitroTots-iOS:
    build:
      targets:
        NitroTots-iOS: all
    run:
      config: Debug
  NitroTots-macOS:
    build:
      targets:
        NitroTots-macOS: all
    run:
      config: Debug
