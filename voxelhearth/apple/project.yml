name: VoxelHearth
options:
  bundleIdPrefix: com.voxelhearth
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  HearthCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    METAL_FAST_MATH: YES
targetTemplates:
  HearthApp:
    type: application
    sources:
      - path: Sources
      - path: Resources
        excludes: [iOS.xcassets, macOS.xcassets]
    dependencies:
      - package: HearthCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voxelhearth.voxelhearth
        PRODUCT_NAME: VoxelHearth
    info:
      properties:
        CFBundleDisplayName: VoxelHearth
        NSLocalNetworkUsageDescription: Connect to your VoxelHearth multiplayer server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UIAppFonts:
          - Outfit-Variable.ttf
          - PixelifySans-Variable.ttf
          - Fraunces-Variable.ttf
targets:
  VoxelHearth-LogicTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/Session.swift
      - Sources/Game.swift
      - Tests
    dependencies:
      - package: HearthCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.voxelhearth.logic-tests
  VoxelHearth-iOS:
    templates: [HearthApp]
    platform: iOS
    sources:
      - Resources/iOS.xcassets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Config/iOS-Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  VoxelHearth-macOS:
    templates: [HearthApp]
    platform: macOS
    sources:
      - Resources/macOS.xcassets
    entitlements:
      path: Config/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Config/macOS-Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.games
        NSHighResolutionCapable: true
schemes:
  VoxelHearth-iOS:
    build:
      targets:
        VoxelHearth-iOS: all
  VoxelHearth-macOS:
    build:
      targets:
        VoxelHearth-macOS: all
    test:
      targets:
        - VoxelHearth-LogicTests
