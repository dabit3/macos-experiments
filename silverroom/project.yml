name: Silverroom
options:
  bundleIdPrefix: com.nader.ioscollection
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  Silverroom:
    type: application
    platform: iOS
    sources: [Silverroom]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nader.ioscollection.silverroom
        INFOPLIST_FILE: Silverroom/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  SilverroomTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SilverroomTests]
    dependencies:
      - target: Silverroom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Silverroom:
    build:
      targets:
        Silverroom: all
        SilverroomTests: [test]
    test:
      targets: [SilverroomTests]
