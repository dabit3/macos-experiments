name: SupperClub
options:
  bundleIdPrefix: com.supperclub
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  SupperClub:
    type: application
    platform: iOS
    sources: [SupperClub]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supperclub.ioscollection
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Supper Club
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SupperClubTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SupperClubTests]
    dependencies:
      - target: SupperClub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SupperClub:
    build:
      targets:
        SupperClub: all
        SupperClubTests: [test]
    test:
      targets: [SupperClubTests]
