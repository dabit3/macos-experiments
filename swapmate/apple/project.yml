name: Swapmate
options:
  bundleIdPrefix: dev.swapmate
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_BUNDLE_IDENTIFIER: dev.swapmate.swapmate
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Swapmate-iOS:
    type: application
    platform: iOS
    sources:
      - App
      - Sources/SwapmateKit
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/iOS.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Swapmate
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: iOS-Info.plist
      properties:
        CFBundleDisplayName: Swapmate
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: Swapmate connects to your chosen local game server for live multiplayer chess.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - BarlowCondensed-ExtraBold.ttf
  Swapmate-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - Sources/SwapmateKit
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/macOS.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Swapmate
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: macOS-Info.plist
      properties:
        CFBundleDisplayName: Swapmate
        LSApplicationCategoryType: public.app-category.board-games
        NSLocalNetworkUsageDescription: Swapmate connects to your chosen local game server for live multiplayer chess.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Swapmate.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
schemes:
  Swapmate-iOS:
    build:
      targets:
        Swapmate-iOS: all
  Swapmate-macOS:
    build:
      targets:
        Swapmate-macOS: all
