name: Lastfort
options:
  bundleIdPrefix: com.lastfort
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  Lastfort-iOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Lastfort
        PRODUCT_BUNDLE_IDENTIFIER: com.lastfort.lastfort
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: Config/iOS-Info.plist
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleDisplayName: Lastfort
        NSLocalNetworkUsageDescription: Lastfort connects to your local multiplayer game server.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  Lastfort-macOS:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Lastfort
        PRODUCT_BUNDLE_IDENTIFIER: com.lastfort.lastfort
        INFOPLIST_FILE: Config/macOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Lastfort.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Config/macOS-Info.plist
      properties:
        CFBundleDisplayName: Lastfort
        NSHumanReadableCopyright: Copyright © Lastfort contributors
        LSApplicationCategoryType: public.app-category.action-games
        NSLocalNetworkUsageDescription: Lastfort connects to your local multiplayer game server.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
schemes:
  Lastfort-iOS:
    build:
      targets:
        Lastfort-iOS: all
    run:
      config: Debug
  Lastfort-macOS:
    build:
      targets:
        Lastfort-macOS: all
    run:
      config: Debug
