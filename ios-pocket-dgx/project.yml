name: PocketDGX
options:
  bundleIdPrefix: studio.pocketdgx
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  PocketDGX:
    type: application
    platform: iOS
    sources:
      - App
      - Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.pocketdgx.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Pocket DGX
        INFOPLIST_KEY_NSCameraUsageDescription: Pocket DGX uses the camera to place a glowing AI supercomputer in your room with AR.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save snapshots of your rig to your photo library.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  PocketDGX:
    build:
      targets:
        PocketDGX: all
    run:
      config: Debug
