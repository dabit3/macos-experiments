name: RooftopRaccoon
options:
  bundleIdPrefix: com.nader
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  RooftopRaccoon:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nader.rooftopraccoon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rooftop Raccoon
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  RooftopRaccoonTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RooftopRaccoon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RooftopRaccoon:
    build:
      targets:
        RooftopRaccoon: all
        RooftopRaccoonTests: [test]
    test:
      targets: [RooftopRaccoonTests]
