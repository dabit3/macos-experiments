name: PanicPantry
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_NAME: PanicPantry
    PRODUCT_BUNDLE_IDENTIFIER: dev.panicpantry.panicPantry
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targetTemplates:
  PantryApp:
    type: application
    sources:
      - path: Sources/App
      - path: Sources/PantryKit
        excludes: [Resources]
      - path: Sources/PantryKit/Resources
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
targets:
  PanicPantry-iOS:
    templates: [PantryApp]
    platform: iOS
    sources:
      - path: Assets/iOS/Assets.xcassets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleDisplayName: Panic Pantry
        NSLocalNetworkUsageDescription: Join Panic Pantry kitchens hosted on computers on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  PanicPantry-macOS:
    templates: [PantryApp]
    platform: macOS
    sources:
      - path: Assets/macOS/Assets.xcassets
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Config/macOS.entitlements
    info:
      path: Config/macOS-Info.plist
      properties:
        CFBundleDisplayName: Panic Pantry
        LSApplicationCategoryType: public.app-category.games
        NSLocalNetworkUsageDescription: Join Panic Pantry kitchens hosted on computers on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSHighResolutionCapable: true
schemes:
  PanicPantry-iOS:
    build:
      targets:
        PanicPantry-iOS: all
  PanicPantry-macOS:
    build:
      targets:
        PanicPantry-macOS: all
