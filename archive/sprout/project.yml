name: Sprout
options:
  bundleIdPrefix: com.nader
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  Sprout:
    type: application
    platform: iOS
    sources: [Sprout]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nader.sprout
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sprout
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SproutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SproutTests]
    dependencies:
      - target: Sprout
schemes:
  Sprout:
    build:
      targets:
        Sprout: all
        SproutTests: [test]
    test:
      targets: [SproutTests]
