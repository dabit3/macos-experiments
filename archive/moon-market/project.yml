name: MoonMarket
options:
  bundleIdPrefix: ai.devin.nativegames
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: 1
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MoonMarket:
    type: application
    platform: iOS
    sources: [MoonMarket]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.nativegames.moonmarket
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Moon Market
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchInk
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
  MoonMarketTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MoonMarketTests]
    dependencies:
      - target: MoonMarket
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MoonMarket:
    build:
      targets:
        MoonMarket: all
        MoonMarketTests: [test]
    test:
      targets: [MoonMarketTests]
