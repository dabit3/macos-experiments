name: VelvetRally
options:
  bundleIdPrefix: studio.velvetrally
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  VelvetRally:
    type: application
    platform: iOS
    sources: [VelvetRally]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.velvetrally.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Velvet Rally
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VelvetRallyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VelvetRallyTests]
    dependencies:
      - target: VelvetRally
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VelvetRally:
    build:
      targets:
        VelvetRally: all
    test:
      targets: [VelvetRallyTests]
