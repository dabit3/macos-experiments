name: Emberpath
options:
  bundleIdPrefix: com.nader.ioscollection
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  Emberpath:
    type: application
    platform: iOS
    sources: [Emberpath]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nader.ioscollection.emberpath
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen: {UIColorName: LaunchBackground}
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Emberpath
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  EmberpathTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EmberpathTests]
    dependencies:
      - target: Emberpath
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Emberpath:
    build:
      targets:
        Emberpath: all
        EmberpathTests: [test]
    test:
      targets: [EmberpathTests]
