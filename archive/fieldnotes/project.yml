name: Fieldnotes
options:
  bundleIdPrefix: com.nader
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Fieldnotes:
    type: application
    platform: iOS
    sources: [Fieldnotes]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nader.fieldnotes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fieldnotes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  FieldnotesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FieldnotesTests]
    dependencies:
      - target: Fieldnotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Fieldnotes:
    build:
      targets:
        Fieldnotes: all
    test:
      targets: [FieldnotesTests]
