name: Prismatic
options:
  bundleIdPrefix: com.nader
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
targets:
  Prismatic:
    type: application
    platform: iOS
    sources: [Prismatic]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nader.prismatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Prismatic
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save an exported artwork to your photo library when you choose Save Image.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  PrismaticTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PrismaticTests]
    dependencies:
      - target: Prismatic
schemes:
  Prismatic:
    build:
      targets:
        Prismatic: all
    test:
      targets: [PrismaticTests]
