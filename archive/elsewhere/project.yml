name: Elsewhere
options:
  bundleIdPrefix: com.nader.ioscollection
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIUserInterfaceStyle: Light
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Elsewhere:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nader.ioscollection.elsewhere
        INFOPLIST_KEY_CFBundleDisplayName: Elsewhere
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save your generated postcards to your photo library.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ElsewhereTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Elsewhere
schemes:
  Elsewhere:
    build:
      targets:
        Elsewhere: all
        ElsewhereTests: [test]
    test:
      targets: [ElsewhereTests]
