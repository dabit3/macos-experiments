name: BentoCircuit
options:
  bundleIdPrefix: studio.bentocircuit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: Bento Circuit
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
targets:
  BentoCircuit:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
  BentoCircuitTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: BentoCircuit
schemes:
  BentoCircuit:
    build:
      targets:
        BentoCircuit: all
    test:
      targets:
        - BentoCircuitTests
