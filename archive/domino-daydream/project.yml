name: DominoDaydream
options:
  bundleIdPrefix: studio.daydream
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DominoDaydream:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets, LaunchScreen.storyboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.daydream.domino
        INFOPLIST_KEY_CFBundleDisplayName: Domino Daydream
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save your finished domino board card to Photos.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DominoDaydreamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DominoDaydream
schemes:
  DominoDaydream:
    build:
      targets:
        DominoDaydream: all
        DominoDaydreamTests: [test]
    test:
      targets: [DominoDaydreamTests]
