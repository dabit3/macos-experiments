name: ImpossiblePostcards
options:
  bundleIdPrefix: studio.postcards
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
targets:
  ImpossiblePostcards:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.postcards.impossible
        INFOPLIST_KEY_CFBundleDisplayName: Impossible Postcards
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PostcardMotionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/App
    dependencies:
      - target: ImpossiblePostcards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.postcards.motiontests
schemes:
  ImpossiblePostcards:
    build:
      targets:
        ImpossiblePostcards: all
    test:
      targets:
        - PostcardMotionTests
