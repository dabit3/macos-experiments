name: TinyTectonics
options:
  bundleIdPrefix: com.dabit3
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  TinyTectonics:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dabit3.tinytectonics
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Tiny Tectonics
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  TinyTectonicsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: TinyTectonics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TinyTectonics:
    build:
      targets:
        TinyTectonics: all
    test:
      targets:
        - TinyTectonicsTests
