name: PaperCurrent
options:
  bundleIdPrefix: com.paperstudio
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  PaperCurrent:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Paper Current
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paperstudio.PaperCurrent
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  PaperCurrentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PaperCurrent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PaperCurrent:
    build:
      targets:
        PaperCurrent: all
        PaperCurrentTests: [test]
    test:
      targets: [PaperCurrentTests]
