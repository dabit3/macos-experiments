name: Foldscape
options:
  bundleIdPrefix: studio.foldscape
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Foldscape:
    type: application
    platform: iOS
    sources:
      - Foldscape
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.foldscape.ios
        INFOPLIST_KEY_CFBundleDisplayName: Foldscape
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FoldscapeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FoldscapeTests
    dependencies:
      - target: Foldscape
schemes:
  Foldscape:
    build:
      targets:
        Foldscape: all
        FoldscapeTests: [test]
    test:
      targets:
        - FoldscapeTests
