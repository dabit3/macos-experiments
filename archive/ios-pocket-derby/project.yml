name: PocketDerby
options:
  bundleIdPrefix: games.pocketderby
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
targets:
  PocketDerby:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Pocket Derby
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarHidden: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: games.pocketderby.rooftop
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PocketDerbyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PocketDerby
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PocketDerby:
    build:
      targets:
        PocketDerby: all
    test:
      targets: [PocketDerbyTests]
