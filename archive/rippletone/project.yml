name: Rippletone
options:
  bundleIdPrefix: com.experiments
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Rippletone:
    type: application
    platform: iOS
    sources: [Rippletone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.experiments.rippletone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rippletone
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_UIColorName: LaunchBackground
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  RippletoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Rippletone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Rippletone:
    build:
      targets:
        Rippletone: all
    test:
      targets: [RippletoneTests]
