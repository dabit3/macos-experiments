name: ChromaCascade
options:
  bundleIdPrefix: com.nader.collection
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Chroma Cascade
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  ChromaCascade:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nader.collection.chromacascade
  ChromaCascadeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ChromaCascade
schemes:
  ChromaCascade:
    build:
      targets:
        ChromaCascade: all
        ChromaCascadeTests: [test]
    test:
      targets: [ChromaCascadeTests]
