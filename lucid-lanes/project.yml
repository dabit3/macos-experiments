name: LucidLanes
options:
  bundleIdPrefix: com.dabit.lucidlanes
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  LucidLanes:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dabit.lucidlanes
        PRODUCT_NAME: LucidLanes
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Lucid Lanes
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: YES
        ITSAppUsesNonExemptEncryption: NO
  LucidLanesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: LucidLanes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LucidLanes:
    build:
      targets:
        LucidLanes: all
        LucidLanesTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - LucidLanesTests
