name: DuskAngler
options:
  bundleIdPrefix: com.naderdabit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  DuskAngler:
    type: application
    platform: iOS
    sources: [DuskAngler]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naderdabit.duskangler
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dusk Angler
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DuskAnglerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DuskAnglerTests]
    dependencies:
      - target: DuskAngler
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DuskAngler:
    build:
      targets:
        DuskAngler: all
    test:
      targets: [DuskAnglerTests]
