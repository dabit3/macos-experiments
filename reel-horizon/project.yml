name: ReelHorizon
options:
  bundleIdPrefix: com.naderdabit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ReelHorizon:
    type: application
    platform: iOS
    sources:
      - path: ReelHorizon
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naderdabit.reelhorizon
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Reel Horizon"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        INFOPLIST_KEY_UIStatusBarHidden: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "iPhone Developer"
        TARGETED_DEVICE_FAMILY: "1,2"
  ReelHorizonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReelHorizonTests
    dependencies:
      - target: ReelHorizon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naderdabit.ReelHorizonTests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
  ReelHorizonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReelHorizonUITests
    dependencies:
      - target: ReelHorizon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naderdabit.ReelHorizonUITests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: ReelHorizon
schemes:
  ReelHorizon:
    build:
      targets:
        ReelHorizon: all
        ReelHorizonTests: [test]
        ReelHorizonUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReelHorizonTests
        - ReelHorizonUITests
