name: OtterFlap
options:
  bundleIdPrefix: studio.otterflap
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OtterFlap:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.otterflap.game
        INFOPLIST_KEY_CFBundleDisplayName: Otter Flap
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OtterFlapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: OtterFlap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.otterflap.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OtterFlap:
    build:
      targets:
        OtterFlap: all
    test:
      targets:
        - OtterFlapUITests
